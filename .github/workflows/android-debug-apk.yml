name: KeyPop Android debug APK
on:
  push:
    branches: [main, feature/v0.9-material-teal-first-run-model-packs, feature/v0.9.1-sindhi-startup-repair, feature/v0.9.2-forensic-launch-smoke, feature/v1.0.8-rc9-sindhi-onnx-engine, feature/v1.0.8-rc9-android-runtime-verification, feature/offline-sindhi-release-blocker, feature/v1.0.0-offline-sindhi-consolidated, feature/gboard-parity-live-predictions-20261107, feature/rc8-fast-typing-translate-packs-20261107, feature/rc9-smart-autocorrect-resumable-downloads-20261107]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run tests, lint and compile debug APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage five named APK variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "dist/KeyPop-v1.0.8-rc9-${abi}-debug.apk"
          done
          cp "app/build/outputs/apk/debug/app-universal-debug.apk" "dist/KeyPop-v1.0.8-rc9-universal-debug.apk"
          cp "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "dist/KeyPop-v1.0.8-rc9-androidTest.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-all-five-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-instrumentation
          path: dist/KeyPop-v1.0.8-rc9-androidTest.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-ARM64
          path: dist/KeyPop-v1.0.8-rc9-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-ARM32
          path: dist/KeyPop-v1.0.8-rc9-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-x86
          path: dist/KeyPop-v1.0.8-rc9-x86-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-x86_64
          path: dist/KeyPop-v1.0.8-rc9-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-Universal
          path: dist/KeyPop-v1.0.8-rc9-universal-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Verify launcher, packs, and keyboard on an Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-instrumentation
          path: dist
      - name: Grant KVM permission for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and run runtime smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke_test_android.sh
      - name: Upload screenshot, UI tree and logcat for forensic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-emulator-forensic-evidence
          path: forensic-evidence/
          if-no-files-found: ignore
          retention-days: 30

  publish-preview:
    name: Publish five individually downloadable prerelease APK assets
    needs: [android, emulator-smoke]
    # Testing-only prerelease APKs: NOT a production release. GH issue #13
    # still blocks claims of complete offline Sindhi translation readiness.
    # Publish only the specific RC9 parity branch after both CI jobs pass.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/rc9-smart-autocorrect-resumable-downloads-20261107' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.8-rc9-all-five-apks
          path: dist
      - name: Publish or refresh GitHub preview release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.0.8-rc9-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*-debug.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/*-debug.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KeyPop v1.0.8-rc9 Preview — Android Debug APKs" \
              --notes "KeyPop v1.0.8 RC9 DEBUG PREVIEW (not production certified): faster off-main suggestions with debounced and reusable chips; spelling corrections including tge→the and shoukd→should, while preserving valid word/screenshots; independent adjustable key and suggestion font sizes; Gboard-like staggered second row, large backspace and shift, dedicated comma; optional screenshot clipboard preview with secure insert/share; selective model packs show downloaded/remaining MB, speed, ETA, auto retries and resume with HTTP range checks and connectivity awareness. Total Sindhi bytes are estimates, Google ML Kit download bytes/ETA are not exposed by the API. Downloaded Sindhi ONNX files are not yet proven to give usable full-sentence translation (issue #13). Emulator checks cannot guarantee pixel-perfect real-device parity or fully verify network interruption behavior."
          fi
