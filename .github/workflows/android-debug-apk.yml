name: KeyPop Android debug APK
on:
  push:
    branches: [main, feature/v0.6-consolidated-parity-20261106]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run tests, lint and compile debug APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Stage five named APK variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "dist/KeyPop-v0.6.0-${abi}-debug.apk"
          done
          cp "app/build/outputs/apk/debug/app-universal-debug.apk" "dist/KeyPop-v0.6.0-universal-debug.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-all-five-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-ARM64
          path: dist/KeyPop-v0.6.0-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-ARM32
          path: dist/KeyPop-v0.6.0-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-x86
          path: dist/KeyPop-v0.6.0-x86-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-x86_64
          path: dist/KeyPop-v0.6.0-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.6.0-Universal
          path: dist/KeyPop-v0.6.0-universal-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish five individually downloadable prerelease APK assets
    needs: android
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.6-consolidated-parity-20261106' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v0.6.0-all-five-apks
          path: dist
      - name: Publish or refresh GitHub preview release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.6.0-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KeyPop v0.6.0 Preview — Android Debug APKs" \
              --notes "EXPERIMENTAL DEBUG TEST BUILDS. All five variants are separate, direct-download APK assets. Not a security-audited or Play Store-ready release. Do not enter real banking credentials. ARM64 suits most current Android phones; Universal is the widest-compatibility build. Feature parity with Gboard/SwiftKey has NOT been verified. Development source: PR #5."
          fi
