name: KeyPop RC23 install-safe debug APK
on:
  push:
    branches:
      - feature/rc23-low-latency-keyboard-20261109
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not let older RC commits overwrite newer release assets. Only the most
# recent commit on each branch should complete the expensive Android jobs.
concurrency:
  group: keypop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run tests, lint and compile debug APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage five named APK variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "dist/KeyPop-v1.0.22-rc23-${abi}-debug.apk"
          done
          cp "app/build/outputs/apk/debug/app-universal-debug.apk" "dist/KeyPop-v1.0.22-rc23-universal-debug.apk"
          cp "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "dist/KeyPop-v1.0.22-rc23-androidTest.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-all-five-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-instrumentation
          path: dist/KeyPop-v1.0.22-rc23-androidTest.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-ARM64
          path: dist/KeyPop-v1.0.22-rc23-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-ARM32
          path: dist/KeyPop-v1.0.22-rc23-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-x86
          path: dist/KeyPop-v1.0.22-rc23-x86-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-x86_64
          path: dist/KeyPop-v1.0.22-rc23-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-Universal
          path: dist/KeyPop-v1.0.22-rc23-universal-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Verify launcher, packs, and keyboard on an Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-instrumentation
          path: dist
      - name: Grant KVM permission for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and run runtime smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke_test_android.sh
      - name: Upload screenshot, UI tree and logcat for forensic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-emulator-forensic-evidence
          path: forensic-evidence/
          if-no-files-found: ignore
          retention-days: 30

  publish-debug-preview:
    name: Publish five individually downloadable prerelease APK assets
    needs: [android, emulator-smoke]
    # Testing-only prerelease APKs: NOT a production release. GH issue #13
    # still blocks claims of complete offline Sindhi translation readiness.
    # Publish only the specific RC23 parity branch after both CI jobs pass.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/rc23-low-latency-keyboard-20261109' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.22-rc23-all-five-apks
          path: dist
      - name: Publish or refresh GitHub preview release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.0.22-rc23-debug-preview"
          LATEST="$(gh api "repos/$GH_REPO/branches/feature/rc23-low-latency-keyboard-20261109" --jq '.commit.sha')"
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "Not publishing stale commit $GITHUB_SHA (latest is $LATEST)." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*-debug.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/*-debug.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KeyPop v1.0.22-rc23 Debug Preview — Android APKs" \
              --notes "KeyPop RC23 DEBUG PREVIEW — responsive typing forensic fix plus the RC22 modular themes/layouts/keysets. The main keypress handler uses a short-lived RAM-only editor mirror instead of Android getTextBeforeCursor IPC for each letter, including cache invalidation when the cursor moves or an editor selection changes. Avoids expensive SCOWL dictionary scans during Spacebar correction; uses asynchronous prepared corrections plus a constant-time verified typo fallback (topredict → to predict, tge → the). Skips duplicate selection-update prediction refreshes after own edits, keeps personalized predictions and translation on background workers, avoids full keyboard rebuild for screenshot-dismiss, and reduces theme animation invalidation during active typing. Backspace repeat, Roman transliteration, selected suggestions, punctuation and text-editor selection changes invalidate/update the mirror safely. Performance Diagnostics displays remote editor snapshot timing and editor context cache reuse. Includes cross-compatible independent visual themes, geometry and Gboard/SwiftKey/Samsung-inspired symbol packs from RC22. Debug package com.aetherkeys.keyboard.previewv123 is separate from RC21/RC20 and does not migrate encrypted data automatically; export full backup before uninstalling an old preview. Emulator tests cannot establish real-world Gboard latency parity; use device profiling on Redmi Note 13 before production release."
          fi
