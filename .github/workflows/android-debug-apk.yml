name: KeyPop Android debug APK
on:
  push:
    branches: [main, feature/v0.9-material-teal-first-run-model-packs, feature/v0.9.1-sindhi-startup-repair, feature/v0.9.2-forensic-launch-smoke, feature/v0.9.3-sindhi-onnx-engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run tests, lint and compile debug APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Stage five named APK variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "dist/KeyPop-v0.9.3-${abi}-debug.apk"
          done
          cp "app/build/outputs/apk/debug/app-universal-debug.apk" "dist/KeyPop-v0.9.3-universal-debug.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-all-five-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-ARM64
          path: dist/KeyPop-v0.9.3-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-ARM32
          path: dist/KeyPop-v0.9.3-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-x86
          path: dist/KeyPop-v0.9.3-x86-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-x86_64
          path: dist/KeyPop-v0.9.3-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-Universal
          path: dist/KeyPop-v0.9.3-universal-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Verify launcher, packs, and keyboard on an Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v0.9.3-x86_64
          path: dist
      - name: Grant KVM permission for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and run runtime smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash ci/smoke_test_android.sh
      - name: Upload screenshot, UI tree and logcat for forensic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v0.9.3-emulator-forensic-evidence
          path: forensic-evidence/
          if-no-files-found: ignore
          retention-days: 30

  publish-preview:
    name: Publish five individually downloadable prerelease APK assets
    needs: [android, emulator-smoke]
    if: ${{ false }} # Do not release partial model installer as a finished translator
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v0.9.3-all-five-apks
          path: dist
      - name: Publish or refresh GitHub preview release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.9.3-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KeyPop v0.9.3 Preview — Android Debug APKs" \
              --notes "EXPERIMENTAL DEBUG TEST BUILDS. All five variants are separate, direct-download APK assets. Not a security-audited or Play Store-ready release. Do not enter real banking credentials. ARM64 suits most current Android phones; Universal is the widest-compatibility build. Feature parity with Gboard/SwiftKey has NOT been verified. Development source: v0.9.3 startup and Sindhi branch. First-launch language packs require user consent. Speech models depend on an Android provider; real-device parity tests pending."
          fi
