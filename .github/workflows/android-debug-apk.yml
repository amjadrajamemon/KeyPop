name: KeyPop RC18 install-safe debug APK
on:
  push:
    branches:
      - feature/rc18-responsive-typing-engine-20261108
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not let older RC commits overwrite newer release assets. Only the most
# recent commit on each branch should complete the expensive Android jobs.
concurrency:
  group: keypop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run tests, lint and compile debug APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage five named APK variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "dist/KeyPop-v1.0.17-rc18-${abi}-debug.apk"
          done
          cp "app/build/outputs/apk/debug/app-universal-debug.apk" "dist/KeyPop-v1.0.17-rc18-universal-debug.apk"
          cp "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "dist/KeyPop-v1.0.17-rc18-androidTest.apk"
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-all-five-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-instrumentation
          path: dist/KeyPop-v1.0.17-rc18-androidTest.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-ARM64
          path: dist/KeyPop-v1.0.17-rc18-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-ARM32
          path: dist/KeyPop-v1.0.17-rc18-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-x86
          path: dist/KeyPop-v1.0.17-rc18-x86-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-x86_64
          path: dist/KeyPop-v1.0.17-rc18-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-Universal
          path: dist/KeyPop-v1.0.17-rc18-universal-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Verify launcher, packs, and keyboard on an Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-instrumentation
          path: dist
      - name: Grant KVM permission for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and run runtime smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke_test_android.sh
      - name: Upload screenshot, UI tree and logcat for forensic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-emulator-forensic-evidence
          path: forensic-evidence/
          if-no-files-found: ignore
          retention-days: 30

  publish-debug-preview:
    name: Publish five individually downloadable prerelease APK assets
    needs: [android, emulator-smoke]
    # Testing-only prerelease APKs: NOT a production release. GH issue #13
    # still blocks claims of complete offline Sindhi translation readiness.
    # Publish only the specific RC18 parity branch after both CI jobs pass.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/rc18-responsive-typing-engine-20261108' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-v1.0.17-rc18-all-five-apks
          path: dist
      - name: Publish or refresh GitHub preview release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.0.17-rc18-debug-preview"
          LATEST="$(gh api "repos/$GH_REPO/branches/feature/rc18-responsive-typing-engine-20261108" --jq '.commit.sha')"
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "Not publishing stale commit $GITHUB_SHA (latest is $LATEST)." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*-debug.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/*-debug.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KeyPop v1.0.17-rc18 Debug Preview — Android APKs" \
              --notes "KeyPop RC18 DEBUG PREVIEW: performs a Gboard-informed typing responsiveness audit. Preloads the 39k SCOWL dictionary on a background worker; never loads it or performs long learned-word writes in the Space-key handler. Replaces per-candidate edit-distance matrix allocations with an allocation-free single-edit matcher and caps one-letter candidate enumerations; skips stale prediction tasks and coalesces repeated editor-selection updates. Screenshot appearance now updates only the offer strip without rebuilding the whole key grid. Clipboard panel renders smaller pages while preserving a complete encrypted searchable archive. Adds opt-in private keypress, prediction and keyboard-rendering latency percentiles in Performance Lab. Retains RC17 features: screenshot detection while IME visible (with user-approved media permissions), swipeable tool pages, stronger spelling/grammar hints and password-encrypted portable clipboard TEXT backup. RC18 fixes a stale test-label expectation and adds on-device prediction performance smoke tests. It installs beside RC16 and RC15 using package com.aetherkeys.keyboard.previewv118. No Google proprietary code and no production signing; real Redmi Note 13 p95 comparison still required."
          fi
